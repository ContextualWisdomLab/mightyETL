name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 2 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    if: ${{ github.event.repository.private == false }}
    name: Analyze (Java)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          category: "/language:java"

  codeql-private-note:
    if: ${{ github.event.repository.private == true }}
    name: CodeQL private repo note
    runs-on: ubuntu-latest
    steps:
      - name: Document unavailability on private repositories
        run: |
          echo "Code scanning is not enabled for this private repository in current plan/settings."
          echo "Enable GitHub Advanced Security and Code Scanning to activate CodeQL upload."
