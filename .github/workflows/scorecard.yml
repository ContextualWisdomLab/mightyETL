name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 3 * * 6"
  push:
    branches: [main]

permissions:
  security-events: write
  id-token: write
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        if: ${{ github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          sarif_file: results.sarif

  private_repo_note:
    name: Private repository note
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Note SARIF upload behavior
        run: |
          echo "::notice::Scorecard SARIF upload is skipped for private repositories."
