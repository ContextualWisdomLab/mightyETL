name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: Run on a self-hosted runner (avoids GitHub-hosted minutes)
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.use_self_hosted == false) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\\mvnw.cmd -B test

  test_self_hosted:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_self_hosted == true }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\\mvnw.cmd -B test
