name: SBOM (CycloneDX)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: Run on a self-hosted runner (avoids GitHub-hosted minutes)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  sbom:
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.use_self_hosted == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate CycloneDX SBOM (aggregate)
        run: ./mvnw -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=all -Dcyclonedx.skipAttach=true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml

  sbom_self_hosted:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_self_hosted == true }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate CycloneDX SBOM (aggregate)
        if: runner.os != 'Windows'
        run: ./mvnw -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=all -Dcyclonedx.skipAttach=true

      - name: Generate CycloneDX SBOM (aggregate, Windows)
        if: runner.os == 'Windows'
        run: .\\mvnw.cmd -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=all -Dcyclonedx.skipAttach=true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml
