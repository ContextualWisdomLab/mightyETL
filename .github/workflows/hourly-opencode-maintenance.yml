name: Hourly OpenCode maintenance

on:
  schedule:
    - cron: "43 * * * *"

concurrency:
  group: hourly-opencode-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain-repository:
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
      security-events: read
      statuses: read
    outputs:
      open_pr_heads_before: ${{ steps.snapshot_heads.outputs.open_pr_heads }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout protected default-branch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install checksum-pinned OpenCode CLI
        shell: bash
        env:
          OPENCODE_VERSION: "1.18.13"
          OPENCODE_SHA256: "8d500b20fed2d26e537e221895b1a575476571b4f0089bb29fb13eeb8eb9e937"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${RUNNER_TEMP}/opencode-bin"

          command -v curl >/dev/null
          command -v install >/dev/null
          command -v rg >/dev/null
          command -v sha256sum >/dev/null
          command -v tar >/dev/null

          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "${OPENCODE_SHA256}" "${archive}" \
            | sha256sum --check --strict

          mapfile -t archive_members < <(tar --list --gzip --file "${archive}")
          if [[ "${#archive_members[@]}" -ne 1 || "${archive_members[0]}" != "opencode" ]]; then
            echo "OpenCode archive contains unexpected members" >&2
            exit 1
          fi

          archive_entry_metadata="$(LC_ALL=C tar --list --verbose --numeric-owner --gzip --file "${archive}")"
          if [[ "${archive_entry_metadata:0:1}" != "-" ]]; then
            echo "OpenCode archive member is not a regular file" >&2
            exit 1
          fi

          rm -rf "${install_dir}"
          install -d -m 0700 "${install_dir}"
          tar --extract --gzip --no-same-owner --no-same-permissions \
            --no-overwrite-dir --keep-old-files \
            --file "${archive}" --directory "${install_dir}"
          test -f "${install_dir}/opencode"
          test ! -L "${install_dir}/opencode"
          chmod 0755 "${install_dir}/opencode"
          test "$("${install_dir}/opencode" --version)" = "${OPENCODE_VERSION}"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Snapshot open pull-request heads
        id: snapshot_heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          snapshot="${RUNNER_TEMP}/open-pr-heads-before.json"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=develop&per_page=100" \
            | jq -s --arg repo "${GITHUB_REPOSITORY}" '
                (add // [])
                | map(select(.head.repo.full_name == $repo))
                | map({key: (.number | tostring), value: .head.sha})
                | from_entries
              ' > "${snapshot}"
          printf 'open_pr_heads=%s\n' "$(jq -c . "${snapshot}")" >> "${GITHUB_OUTPUT}"

      - name: Run bounded NVIDIA OpenCode maintenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          MODEL: nvidia/deepseek-ai/deepseek-v4-pro
          SHARE: "false"
          USE_GITHUB_TOKEN: "true"
          PROMPT: |
            Maintain ContextualWisdomLab/mightyETL toward defensible commercial and acquisition readiness.

            Start every run by inspecting every open pull request and its exact current head. Review unresolved human, CodeRabbit, GitHub Advanced Security, Dependabot, and automated feedback. Inspect required checks, statuses, and workflow outcomes. Treat queued, pending, skipped-required, stale-head, cancelled, absent, or unsuccessful gates as not passing. Distinguish valid current findings from stale, duplicate, incorrect, or superseded feedback. Resolve only threads that the current exact head actually addresses.

            If a development pull request is open, work only on the dependency-eligible exact current head of that pull request. Do not create a second development pull request while another development pull request is open. Implement valid fixes test-first, rerun relevant tests, update authoritative documentation and CHANGELOG.md, and update the existing feature branch and pull request. Close only clearly superseded duplicate pull requests with a precise reason.

            If no development pull request is open, inspect open issues, roadmap, architecture, security, privacy, reliability, observability, accessibility, packaging, interoperability, deployment, data governance, operational workflows, release evidence, and buyer-visible gaps. Select exactly one highest-impact bounded vertical slice. Prefer durable ETL execution, idempotency, replay, dead-letter handling, schema contracts, connector reliability, target warehouse support, tenancy, auditability, SLO evidence, and operator controls. Prefer issue #120 while its durable lease-fenced worker gap remains open and dependency-ready.

            Preserve standalone operation and modular MSA compatibility with ContextualWisdomLab/.github, naruon, and other CWL services. Database objects must contain at least two descriptive words and use snake_case by default. Public production APIs require complete beginner-readable documentation. Added production statements and branches require deterministic coverage. Use current authoritative standards, primary technical documentation, and peer-reviewed evidence where material, with APA 7th references in repository documentation.

            Never approve or merge a pull request. Never push directly to develop or main. Do not bypass branch protection, independent approval, security gates, repository policy, required checks, or test coverage. Do not publish a release unless a separate release-authorized workflow and every acceptance gate explicitly permit it.

            Do not alter the existing review agent, its workflow, its provider configuration, or its credential flow. Do not change any review-agent secret name. Do not inspect secret values. Do not print, echo, summarize, or expose secret values. Do not modify .github/workflows/ or CODEOWNERS unless an open issue explicitly labeled automation-maintenance authorizes that exact bounded automation change; even then, prepare a pull request and leave approval and merge to an independent gate.

            Use the repository-scoped GitHub token only for the minimum branch, pull-request, issue, check, status, and security-read operations required by this run. Keep the working tree and pull-request description truthful about tests, skipped coverage, remaining risks, and release readiness. Leave one reviewable feature branch and pull request; never represent pending external gates as completed.
        run: |
          set -euo pipefail
          if [[ -z "${NVIDIA_API_KEY}" ]]; then
            echo "NVIDIA_NIM_API_KEY is required for scheduled OpenCode maintenance" >&2
            exit 1
          fi
          if [[ -z "${GITHUB_TOKEN}" || -z "${GH_TOKEN}" ]]; then
            echo "The repository-scoped GitHub token is required for scheduled maintenance" >&2
            exit 1
          fi

          # OpenCode 1.18.13 skips its internal Git credential and author setup in
          # USE_GITHUB_TOKEN mode. Install a repository-local GitHub CLI helper while
          # preserving checkout's persist-credentials: false supply-chain boundary.
          git_credential_key="credential.https://github.com.helper"
          cleanup_git_credentials() {
            git config --local --unset-all "${git_credential_key}" >/dev/null 2>&1 || true
          }
          trap cleanup_git_credentials EXIT
          cleanup_git_credentials
          git config --local --add "${git_credential_key}" ""
          git config --local --add "${git_credential_key}" "!gh auth git-credential"
          git config --local user.name "opencode-agent[bot]"
          git config --local user.email "opencode-agent[bot]@users.noreply.github.com"

          timeout --signal=TERM --kill-after=30s 45m opencode github run

  authorize-exact-head-checks:
    needs: maintain-repository
    if: ${{ always() && !cancelled() }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authorize exact-head checks for agent-updated pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_HEADS: ${{ needs.maintain-repository.outputs.open_pr_heads_before }}
        run: |
          set -euo pipefail
          before_file="${RUNNER_TEMP}/open-pr-heads-before.json"
          after_file="${RUNNER_TEMP}/open-pr-heads-after.json"
          changed_file="${RUNNER_TEMP}/agent-changed-pr-heads.jsonl"
          repository="${GITHUB_REPOSITORY}"
          failed=0

          if [[ -z "${BEFORE_HEADS}" ]]; then
            echo "Open pull-request head snapshot is unavailable" >&2
            exit 1
          fi
          printf '%s\n' "${BEFORE_HEADS}" \
            | jq -e 'select(type == "object")' > "${before_file}"

          gh api --paginate \
            "/repos/${repository}/pulls?state=open&base=develop&per_page=100" \
            | jq -s '(add // [])' > "${after_file}"
          jq -c --arg repo "${repository}" --slurpfile before "${before_file}" '
            .[]
            | select(.head.repo.full_name == $repo)
            | select(.base.ref == "develop")
            | (.number | tostring) as $number_key
            | ($before[0][$number_key] // null) as $previous_head
            | select($previous_head != .head.sha)
            | {
                number: .number,
                head_ref: .head.ref,
                head_sha: .head.sha
              }
          ' "${after_file}" > "${changed_file}"

          while IFS= read -r changed_pull_request; do
            [[ -n "${changed_pull_request}" ]] || continue
            number="$(jq -r '.number' <<<"${changed_pull_request}")"
            head_ref="$(jq -r '.head_ref' <<<"${changed_pull_request}")"
            expected_head="$(jq -r '.head_sha' <<<"${changed_pull_request}")"

            changed_files="$(
              gh api --paginate "/repos/${repository}/pulls/${number}/files?per_page=100" \
                | jq -s '(add // []) | map(.filename)'
            )"
            if jq -e '
              any(
                startswith(".github/")
                or . == "CODEOWNERS"
                or endswith("/CODEOWNERS")
              )
            ' >/dev/null <<<"${changed_files}"; then
              echo "PR #${number} changes .github or CODEOWNERS policy; exact-head runs require manual authorization" >&2
              failed=1
              continue
            fi

            current_head="$(gh api "/repos/${repository}/pulls/${number}" --jq '.head.sha')"
            if [[ "${current_head}" != "${expected_head}" ]]; then
              echo "PR #${number} moved before workflow-run discovery" >&2
              failed=1
              continue
            fi

            runs_file="${RUNNER_TEMP}/pr-${number}-exact-head-runs.json"
            run_count=0
            for _ in $(seq 1 18); do
              gh api --paginate \
                "/repos/${repository}/actions/runs?event=pull_request&head_sha=${expected_head}&per_page=100" \
                | jq -s '(map(.workflow_runs) | add) // []' > "${runs_file}"
              run_count="$(jq 'length' "${runs_file}")"
              if [[ "${run_count}" -gt 0 ]]; then
                break
              fi
              sleep 5
            done

            if [[ "${run_count}" -eq 0 ]]; then
              echo "No pull-request workflow run materialized for PR #${number} exact head ${expected_head}" >&2
              failed=1
              continue
            fi

            current_head="$(gh api "/repos/${repository}/pulls/${number}" --jq '.head.sha')"
            if [[ "${current_head}" != "${expected_head}" ]]; then
              echo "PR #${number} moved before workflow-run authorization" >&2
              failed=1
              continue
            fi

            while IFS= read -r run_id; do
              [[ -n "${run_id}" ]] || continue
              gh api --method POST \
                "/repos/${repository}/actions/runs/${run_id}/approve"
            done < <(
              jq -r --arg expected_head "${expected_head}" '
                .[]
                | select(
                    .head_sha == $expected_head
                    and (
                      .conclusion == "action_required"
                      or .status == "waiting"
                    )
                  )
                | .id
              ' "${runs_file}"
            )

            echo "Authorized exact-head pull-request checks for PR #${number} branch ${head_ref} at ${expected_head}"
          done < "${changed_file}"

          exit "${failed}"
