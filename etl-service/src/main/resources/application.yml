server:
  port: 8000

spring:
  application:
    name: etl-service
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Dual-read: mightyetl.connectors.* preferred (aliased to xtrmetl.connectors.*).
# Target connector scaffolds (all disabled). Primary load path: PostgreSQL via EtlService.
# Catalog: GET /api/etl/connectors — see docs/connectors/
xtrmetl:
  connectors:
    databricks:
      enabled: ${DATABRICKS_CONNECTOR_ENABLED:false}
      # host, http-path, token, catalog, schema, table — unused until implemented
    snowflake:
      enabled: ${SNOWFLAKE_CONNECTOR_ENABLED:false}
      # account, warehouse, database, schema, user — unused until implemented
    qlik-sense:
      enabled: ${QLIK_CONNECTOR_ENABLED:false}
      # tenant-url, api-key, app-id — unused until implemented

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9412/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

logging:
  level:
    root: INFO
    com:
      xtrmetl: DEBUG
    org:
      springframework:
        web: DEBUG
