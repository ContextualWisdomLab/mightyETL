server:
  port: 8000

spring:
  application:
    name: etl-service
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
    clean-disabled: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Dual-read: mightyetl.* preferred (aliased to xtrmetl.* for known keys).
# Primary load path: PostgreSQL via EtlService. Catalog: GET /api/etl/connectors
xtrmetl:
  etl:
    max-payload-bytes: ${ETL_MAX_PAYLOAD_BYTES:1048576}
    max-batch-records: ${ETL_MAX_BATCH_RECORDS:1000}
    jobs:
      # Intake persists validated payloads for durable worker execution.
      intake-enabled: ${ETL_JOB_INTAKE_ENABLED:false}
      worker:
        # Execution remains fail-closed until an operator enables the worker explicitly.
        enabled: ${ETL_JOB_WORKER_ENABLED:false}
        # Scheduler delays are bounded to one day (86,400,000 milliseconds).
        fixed-delay-milliseconds: ${ETL_JOB_WORKER_FIXED_DELAY_MILLISECONDS:5000}
        initial-delay-milliseconds: ${ETL_JOB_WORKER_INITIAL_DELAY_MILLISECONDS:5000}
        # Leases are bounded to one day (86,400 seconds); longer jobs require lease renewal.
        lease-duration-seconds: ${ETL_JOB_WORKER_LEASE_DURATION_SECONDS:300}
        max-attempts: ${ETL_JOB_WORKER_MAX_ATTEMPTS:3}
  # Warehouse/BI targets: SPI + config binding + validation + catalog; writes remain SCAFFOLD.
  connectors:
    databricks:
      enabled: ${DATABRICKS_CONNECTOR_ENABLED:false}
      host: ${DATABRICKS_HOST:}
      http-path: ${DATABRICKS_HTTP_PATH:}
      token: ${DATABRICKS_TOKEN:}
      catalog: ${DATABRICKS_CATALOG:}
      schema: ${DATABRICKS_SCHEMA:}
      table: ${DATABRICKS_TABLE:}
      write-mode: ${DATABRICKS_WRITE_MODE:append}
    snowflake:
      enabled: ${SNOWFLAKE_CONNECTOR_ENABLED:false}
      account: ${SNOWFLAKE_ACCOUNT:}
      warehouse: ${SNOWFLAKE_WAREHOUSE:}
      database: ${SNOWFLAKE_DATABASE:}
      schema: ${SNOWFLAKE_SCHEMA:}
      user: ${SNOWFLAKE_USER:}
      password: ${SNOWFLAKE_PASSWORD:}
      private-key: ${SNOWFLAKE_PRIVATE_KEY:}
      role: ${SNOWFLAKE_ROLE:}
      table: ${SNOWFLAKE_TABLE:}
      merge-keys: ${SNOWFLAKE_MERGE_KEYS:}
    qlik-sense:
      enabled: ${QLIK_CONNECTOR_ENABLED:false}
      tenant-url: ${QLIK_TENANT_URL:}
      api-key: ${QLIK_API_KEY:}
      app-id: ${QLIK_APP_ID:}
      mode: ${QLIK_MODE:reload-only}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9412/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

logging:
  level:
    root: INFO
    com:
      xtrmetl: DEBUG
    org:
      springframework:
        web: DEBUG
