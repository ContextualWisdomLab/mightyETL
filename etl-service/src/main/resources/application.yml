server:
  port: 8000

spring:
  application:
    name: etl-service
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Dual-read: mightyetl.* preferred (aliased to xtrmetl.*).
# ETL admission control rejects oversized batches before work is scheduled.
# max-concurrency intentionally uses its CPU-adaptive Java default when unset; override it with
# mightyetl.etl.max-concurrency, xtrmetl.etl.max-concurrency, or ETL_MAX_CONCURRENCY.
# Short environment aliases: ETL_MAX_BATCH_RECORDS, ETL_MAX_CONCURRENCY, ETL_QUEUE_CAPACITY.
# Warehouse/BI targets: SPI + config binding + validation + catalog; write() still SCAFFOLD.
# Primary load path: PostgreSQL via EtlService. Catalog: GET /api/etl/connectors
xtrmetl:
  etl:
    max-batch-records: ${ETL_MAX_BATCH_RECORDS:1000}
    queue-capacity: ${ETL_QUEUE_CAPACITY:1024}
  connectors:
    databricks:
      enabled: ${DATABRICKS_CONNECTOR_ENABLED:false}
      host: ${DATABRICKS_HOST:}
      http-path: ${DATABRICKS_HTTP_PATH:}
      token: ${DATABRICKS_TOKEN:}
      catalog: ${DATABRICKS_CATALOG:}
      schema: ${DATABRICKS_SCHEMA:}
      table: ${DATABRICKS_TABLE:}
      write-mode: ${DATABRICKS_WRITE_MODE:append}
    snowflake:
      enabled: ${SNOWFLAKE_CONNECTOR_ENABLED:false}
      account: ${SNOWFLAKE_ACCOUNT:}
      warehouse: ${SNOWFLAKE_WAREHOUSE:}
      database: ${SNOWFLAKE_DATABASE:}
      schema: ${SNOWFLAKE_SCHEMA:}
      user: ${SNOWFLAKE_USER:}
      password: ${SNOWFLAKE_PASSWORD:}
      private-key: ${SNOWFLAKE_PRIVATE_KEY:}
      role: ${SNOWFLAKE_ROLE:}
      table: ${SNOWFLAKE_TABLE:}
      merge-keys: ${SNOWFLAKE_MERGE_KEYS:}
    qlik-sense:
      enabled: ${QLIK_CONNECTOR_ENABLED:false}
      tenant-url: ${QLIK_TENANT_URL:}
      api-key: ${QLIK_API_KEY:}
      app-id: ${QLIK_APP_ID:}
      mode: ${QLIK_MODE:reload-only}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9412/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

logging:
  level:
    root: INFO
    com:
      xtrmetl: DEBUG
    org:
      springframework:
        web: DEBUG
