services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      # NOTE: Defaults are for local development only. Override via .env / secrets for production.
      POSTGRES_DB: ${POSTGRES_DB:-xtrmetl}
      POSTGRES_USER: ${POSTGRES_USER:-xtrmetl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xtrmetl}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-replica:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      # NOTE: Defaults are for local development only. Override via .env / secrets for production.
      POSTGRES_DB: ${REPLICA_POSTGRES_DB:-xtrmetl}
      POSTGRES_USER: ${REPLICA_POSTGRES_USER:-xtrmetl}
      POSTGRES_PASSWORD: ${REPLICA_POSTGRES_PASSWORD:-xtrmetl}
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"

  zipkin:
    image: openzipkin/zipkin:2
    ports:
      - "9412:9412"

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: eureka-server
    ports:
      - "8761:8761"

  etl-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: etl-service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xtrmetl}
      PGUSER: ${POSTGRES_USER:-xtrmetl}
      PGPASSWORD: ${POSTGRES_PASSWORD:-xtrmetl}
      EUREKA_HOST: eureka-server
      ZIPKIN_HOST: zipkin
    ports:
      - "8000:8000"

  cdc-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: cdc-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xtrmetl}
      PGUSER: ${POSTGRES_USER:-xtrmetl}
      # NOTE: Defaults are for local development only. Override via .env / secrets for production.
      PGPASSWORD: ${POSTGRES_PASSWORD:-xtrmetl}
      # NOTE: postgres-replica is intentionally not in depends_on so CDC can run without the replica when REPLICA_ENABLED=false.
      REPLICA_ENABLED: ${REPLICA_ENABLED:-true}
      REPLICA_PGHOST: ${REPLICA_PGHOST:-postgres-replica}
      REPLICA_PGPORT: ${REPLICA_PGPORT:-5432}
      REPLICA_PGDATABASE: ${REPLICA_POSTGRES_DB:-xtrmetl}
      REPLICA_PGUSER: ${REPLICA_POSTGRES_USER:-xtrmetl}
      REPLICA_PGPASSWORD: ${REPLICA_POSTGRES_PASSWORD:-xtrmetl}
      EUREKA_HOST: eureka-server
      ZIPKIN_HOST: zipkin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8001:8001"

  zuul-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: zuul-gateway
    depends_on:
      - eureka-server
      - zipkin
      - etl-service
      - cdc-service
    environment:
      EUREKA_HOST: eureka-server
      ZIPKIN_HOST: zipkin
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  postgres_replica_data:
