server:
  port: 8080

spring:
  application:
    name: zuul-gateway
  zipkin:
    base-url: http://localhost:9412
  sleuth:
    sampler:
      probability: 1.0

management:
  tracing:
    sampling:
      probability: 1.0

zuul:
  routes:
    etl-service:
      path: /etl/**
      serviceId: etl-service
    cdc-service:
      path: /cdc/**
      serviceId: cdc-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.xtrmetl: DEBUG
    org.springframework.web: DEBUG
