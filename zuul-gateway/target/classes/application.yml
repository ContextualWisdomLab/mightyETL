server:
  port: 8080

spring:
  application:
    name: zuul-gateway

zuul:
  routes:
    etl-service:
      path: /etl/**
      serviceId: etl-service
    cdc-service:
      path: /cdc/**
      serviceId: cdc-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.xtrmetl: DEBUG
