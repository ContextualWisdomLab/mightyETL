server:
  port: 8001

spring:
  application:
    name: cdc-service
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

xtrmetl:
  cdc:
    autostart: ${CDC_AUTOSTART:true}
  replica:
    enabled: ${REPLICA_ENABLED:false}
    group-id: ${REPLICA_GROUP_ID:xtrmetl-cdc-replica}
    topic-pattern: ${REPLICA_TOPIC_PATTERN:xtrmetl-cdc\..*}
    ddl-enabled: ${REPLICA_DDL_ENABLED:false}
    ddl-validation-mode: ${REPLICA_DDL_VALIDATION_MODE:none}
    ddl-allowed-prefixes: ${REPLICA_DDL_ALLOWED_PREFIXES:CREATE TABLE,ALTER TABLE,CREATE INDEX}
    ddl-blocked-prefixes: ${REPLICA_DDL_BLOCKED_PREFIXES:DROP TABLE,DROP SCHEMA,DROP DATABASE,TRUNCATE}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9412/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

logging:
  level:
    root: INFO
    com:
      xtrmetl: DEBUG
    io:
      debezium: INFO
    org:
      springframework:
        web: DEBUG
