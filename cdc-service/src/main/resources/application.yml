server:
  port: 8001

spring:
  application:
    name: cdc-service
  datasource:
    # NOTE: This datasource is intended for the replica applier component. It is always configured,
    # but is only used by the replica applier when `xtrmetl.replica.enabled=true`. It resolves its
    # connection using `REPLICA_PG*` variables, falling back to `PG*` (which may point to the primary),
    # while Debezium continues to use `PG*` variables directly to read CDC from the primary DB.
    url: jdbc:postgresql://${REPLICA_PGHOST:${PGHOST}}:${REPLICA_PGPORT:${PGPORT}}/${REPLICA_PGDATABASE:${PGDATABASE}}
    username: ${REPLICA_PGUSER:${PGUSER}}
    password: ${REPLICA_PGPASSWORD:${PGPASSWORD}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  zipkin:
    base-url: http://${ZIPKIN_HOST:localhost}:9412
  sleuth:
    sampler:
      probability: 1.0

xtrmetl:
  cdc:
    autostart: ${CDC_AUTOSTART:true}
  replica:
    enabled: ${REPLICA_ENABLED:false}
    group-id: ${REPLICA_GROUP_ID:xtrmetl-cdc-replica}
    topic-pattern: ${REPLICA_TOPIC_PATTERN:xtrmetl-cdc\..*}

management:
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

logging:
  level:
    root: INFO
    com.xtrmetl: DEBUG
    io.debezium: INFO
    org.springframework.web: DEBUG
