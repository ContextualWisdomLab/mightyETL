server:
  port: 8001

spring:
  application:
    name: cdc-service
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": ${CDC_KAFKA_DELIVERY_TIMEOUT_MS:60000}
        "[max.block.ms]": ${CDC_KAFKA_MAX_BLOCK_MS:30000}
        "[max.in.flight.requests.per.connection]": 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

# Dual-read: mightyetl.* (preferred) aliases onto xtrmetl.* via EnvironmentPostProcessor.
# Product name: mightyETL. Capture path: PostgreSQL Debezium → Kafka.
# Ops: GET /api/cdc/status, GET /api/cdc/sources — see docs/cdc/ops-and-reliability.md
xtrmetl:
  cdc:
    autostart: ${CDC_AUTOSTART:true}
    # Fixed source type until multi-source factory lands (docs/cdc/any-to-any-cdc.md)
    source-type: postgres-debezium
    # Map Debezium events to CanonicalChangeRecord for counters only (Kafka payload stays raw)
    canonical-map-enabled: ${CDC_CANONICAL_MAP_ENABLED:false}
    # Multi-source declaration (status/reporting only). Live engine still runs one Postgres path.
    sources:
      - id: pg-main
        type: postgres-debezium
        enabled: true
  replica:
    enabled: ${REPLICA_ENABLED:false}
    group-id: ${REPLICA_GROUP_ID:xtrmetl-cdc-replica}
    topic-pattern: ${REPLICA_TOPIC_PATTERN:xtrmetl-cdc\..*}
    # Comma-separated tables with (id, data) shape; default processed_data
    tables: ${REPLICA_TABLES:processed_data}
    ddl-enabled: ${REPLICA_DDL_ENABLED:false}
    # Positive allow-list is the secure default when DDL replication is explicitly enabled.
    ddl-validation-mode: ${REPLICA_DDL_VALIDATION_MODE:whitelist}
    ddl-allowed-prefixes: ${REPLICA_DDL_ALLOWED_PREFIXES:CREATE TABLE,ALTER TABLE,CREATE INDEX}
    ddl-blocked-prefixes: ${REPLICA_DDL_BLOCKED_PREFIXES:DROP TABLE,DROP SCHEMA,DROP DATABASE,TRUNCATE}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9412/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

logging:
  level:
    root: INFO
    com:
      xtrmetl: DEBUG
    io:
      debezium: INFO
    org:
      springframework:
        web: DEBUG
